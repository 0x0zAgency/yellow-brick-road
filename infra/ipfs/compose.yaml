# YBR persistent Kubo pilot: never publish the admin RPC.
services:
  kubo:
    image: ipfs/kubo:v0.43.1
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
      - "127.0.0.1:5001:5001/tcp"
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - ybr-kubo-data:/data/ipfs
      - ybr-kubo-staging:/export
    healthcheck:
      test: ["CMD", "ipfs", "id", "--format=<id>"]
      interval: 30s
      timeout: 15s
      retries: 6
volumes:
  ybr-kubo-data:
  ybr-kubo-staging:
