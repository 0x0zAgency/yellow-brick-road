name: Test
on: [push, pull_request]
jobs:
  hardhat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run compile
      - run: npm test
      - run: npm run demo
      - name: Install wallet integration dependencies
        run: npm --prefix web install --no-audit --no-fund
      - name: Wallet-signed Ganache integration
        run: npm run test:wallet
      - name: Ganache local mint smoke
        run: |
          npm run ganache > /tmp/road-ganache.log 2>&1 &
          GANACHE_PID=$!
          trap 'kill "$GANACHE_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in {1..30}; do
            if curl -fsS -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' http://127.0.0.1:8545 | grep -q '0x539'; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/road-ganache.log; exit 1; fi
          npm run ganache:smoke
          npm --prefix web install --no-audit --no-fund
          node web/scripts/ganache-wallet-smoke.mjs
