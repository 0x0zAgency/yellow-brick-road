name: Web UI
on:
  push:
    paths:
      - 'web/**'
      - 'scripts/dev-dashboard*'
      - 'scripts/dev-ipfs.cjs'
      - 'scripts/dev-ipfs.test.cjs'
      - 'infra/ipfs/**'
      - 'scripts/dev-stack.cjs'
      - 'scripts/dev-stack.test.cjs'
      - 'scripts/dev-stack-smoke.cjs'
      - 'apps/ybr-player/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/dev-dashboard*'
      - 'scripts/dev-ipfs.cjs'
      - 'scripts/dev-ipfs.test.cjs'
      - 'infra/ipfs/**'
      - 'scripts/dev-stack.cjs'
      - 'scripts/dev-stack.test.cjs'
      - 'scripts/dev-stack-smoke.cjs'
      - 'apps/ybr-player/**'
      - '.github/workflows/web.yml'
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install UI dependencies
        run: npm --prefix web install --no-audit --no-fund
      - name: Test model logic
        run: npm --prefix web test
      - name: Build Vite frontend
        run: npm --prefix web run build

  integrated-road-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install integrated Road dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-package-lock --no-audit --no-fund --prefix web
          npm install --no-package-lock --no-audit --no-fund --prefix apps/ybr-player
      - name: Test lifecycle, dashboard and synthetic fixture
        run: npm run test:dev-stack
      - name: Pull Kubo image before timing stack readiness
        run: docker compose -f infra/ipfs/compose.yaml pull kubo
      - name: Start complete Road application and test web, player and IPFS
        shell: bash
        env:
          YBR_LISTENER_PASSWORD: ci-listener-demo-only
          YBR_ARTIST_PASSWORD: ci-artist-demo-only
        run: |
          set -euo pipefail
          node scripts/dev-stack.cjs > /tmp/ybr-integrated.log 2>&1 &
          STACK_PID=$!
          trap 'kill -TERM "$STACK_PID" 2>/dev/null || true; sleep 2; cat /tmp/ybr-integrated.log' EXIT
          node scripts/dev-stack-smoke.cjs
